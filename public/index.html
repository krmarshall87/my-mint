<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Mint</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>My Mint</h1>
    <div class="actions">
      <span id="status" class="muted"></span>
      <button id="sync-btn" class="secondary">Refresh</button>
      <button id="link-btn">+ Link account</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Accounts</h2>
      <ul id="accounts" class="accounts"></ul>
      <p id="no-accounts" class="muted" hidden>No accounts linked yet. Click <strong>+ Link account</strong> to connect a bank.</p>
    </aside>

    <section class="content">
      <form id="filters" class="filters">
        <input type="search" name="q" placeholder="Search merchant or description" />
        <select name="account_id"><option value="">All accounts</option></select>
        <select name="category"><option value="">All categories</option></select>
        <label>From <input type="date" name="start" /></label>
        <label>To <input type="date" name="end" /></label>
        <button type="button" id="export-btn" class="secondary">Export CSV</button>
      </form>

      <div class="summary">
        <div><span class="muted">Transactions</span><strong id="sum-count">0</strong></div>
        <div><span class="muted">Money in</span><strong id="sum-in" class="pos">$0.00</strong></div>
        <div><span class="muted">Money out</span><strong id="sum-out" class="neg">$0.00</strong></div>
        <div><span class="muted">Net</span><strong id="sum-net">$0.00</strong></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th class="num">Amount</th></tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prev-btn" class="secondary">← Newer</button>
        <span id="page-info" class="muted"></span>
        <button id="next-btn" class="secondary">Older →</button>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
