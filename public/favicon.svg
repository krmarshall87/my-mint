<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A sprig of three broad leaves joined at one stem. Original artwork. -->
  <defs>
    <path id="leaf" d="M0 0C-6.5-4-6.5-14.5 0-20C6.5-14.5 6.5-4 0 0Z"/>
    <path id="vein" d="M0-1.5V-16.5"/>
  </defs>
  <g transform="translate(16 16) scale(1.02) translate(-13.85 -18.94) translate(14.5 29.5)">
    <g transform="rotate(-40) scale(.92)">
      <use href="#leaf" fill="#7fdba6"/>
      <use href="#vein" stroke="#f1fff6" stroke-width="1.4" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
    </g>
    <g transform="rotate(72) scale(.68)">
      <use href="#leaf" fill="#00804f"/>
      <use href="#vein" stroke="#d8f7e6" stroke-width="1.2" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
    </g>
    <g transform="rotate(16) scale(1.18)">
      <use href="#leaf" fill="#00a868"/>
      <use href="#vein" stroke="#f1fff6" stroke-width="1.6" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
    </g>
  </g>
</svg>
