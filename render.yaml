# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-mint
    runtime: node
    plan: 0.5c-512mb  # cheapest paid web service; "free" also works but sleeps when idle
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Encrypts Plaid access tokens in the database. Generated once by Render;
      # don't change it later or existing connections can't be decrypted.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      - key: DATABASE_URL
        fromDatabase:
          name: my-mint-db
          property: connectionString

databases:
  - name: my-mint-db
    plan: 0.1c-256mb  # cheapest paid Postgres; "free" also works but expires after 30 days
    databaseName: mymint
    user: mymint
    ipAllowList: []  # internal connections only
