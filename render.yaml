# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-mint
    runtime: node
    plan: free  # sleeps after ~15 min idle; switch to 0.5c-512mb for always-on
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Values set with `value:` are re-applied whenever the Blueprint syncs, so
      # this is the source of truth for the environment, not the dashboard.
      # The secret (PLAID_SECRET) must be the matching production secret.
      - key: PLAID_ENV
        value: production
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Encrypts Plaid access tokens in the database. Generated once by Render;
      # don't change it later or existing connections can't be decrypted.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      # CockroachDB (or any Postgres) connection string, entered in the Render
      # dashboard. Never commit it: it contains the database password.
      - key: DATABASE_URL
        sync: false
