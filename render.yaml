# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-mint
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Encrypts Plaid access tokens in the database. Generated once by Render;
      # don't change it later or existing connections can't be decrypted.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      - key: DATABASE_URL
        fromDatabase:
          name: my-mint-db
          property: connectionString

databases:
  - name: my-mint-db
    plan: basic-256mb
    databaseName: mymint
    user: mymint
    ipAllowList: []  # internal connections only
