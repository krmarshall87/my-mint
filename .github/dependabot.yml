# Weekly dependency updates. Every PR runs the test workflow on both stores;
# minor and patch updates are grouped so there's at most one npm PR a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # plaid 51 is a new SDK (the old one moved to plaid/legacy) with nothing new
      # for the products we use. Upgrading = require('plaid/legacy') in server.js
      # and test/fixtures/plaid-stub.js (tests pass with it). Revisit if Plaid
      # announces the end of v50 or a feature needs the new SDK.
      - dependency-name: plaid
        versions: ['51.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
